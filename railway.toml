# Railway deploy — Next.js web (repo root = app).
# 1. Deploy from GitHub repo arsalan-studio-web (no Root Directory subdirectory)
# 2. Attach Railway Postgres → DATABASE_URL on this service
# 3. Set AUTH_SECRET, AUTH_URL (= https://YOUR-SERVICE.up.railway.app first),
#    NEXT_PUBLIC_SITE_URL, ADMIN_*, optional RESEND_*
# 4. Optional: Cloudflare R2 env (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME)
# 5. After DNS propagates: Custom Domain → arsalandev.studio (do not block launch)

[build]
builder = "NIXPACKS"
buildCommand = "npx prisma generate && npx next build --webpack"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
